<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shelter Architecture Map</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
<header>
  <h1>Shelter Architecture Map</h1>
  <button id="btnConnect" class="primary">📁 Подключить папку проекта</button>
  <button id="btnRegrant" style="display:none">Разрешить доступ</button>
  <button id="btnScan">🔄 Сверить с проектом</button>
  <button id="btnSaveProject" title="Записать отметки в data/scene_plan.json">💾 Прогресс в проект</button>
  <button id="btnLoadProject" title="Загрузить отметки из data/scene_plan.json">📂 Из проекта</button>
  <button id="btnExport" title="Скачать чертёж в Markdown">⬇ Чертёж .md</button>
  <span id="folderStatus" class="status">Папка не подключена — отметки хранятся в браузере</span>
  <div class="spacer"></div>
  <span id="scanStatus" class="status"></span>
</header>

<aside>
  <div class="panel">
    <h3>Прогресс</h3>
    <div id="progressPanel"></div>
  </div>
  <div class="panel">
    <h3>Разделы</h3>
    <div id="navList"></div>
  </div>
  <div class="panel">
    <h3>Проект</h3>
    <div id="projSummary" class="muted">Папка не подключена. Комнаты и здания читаются из data/rooms и data/buildings, .tscn ищутся в папке сцен Godot.</div>
  </div>
</aside>

<main><div id="content"></div></main>
</div>

<!-- Порядок менять нельзя: скрипты делят одну глобальную область, номер = порядок загрузки, INIT — последний -->

<script src="js/02-vocab.js"></script>
<script src="js/03-data-systems-foundation.js"></script>
<script src="js/04-data-systems-character-shelter.js"></script>
<script src="js/05-data-systems-world-npc.js"></script>
<script src="js/06-data-systems-livingworld-consequences.js"></script>
<script src="js/07-data-components.js"></script>
<script src="js/08-data-gameobjects.js"></script>
<script src="js/09-data-domains.js"></script>
<script src="js/10-model.js"></script>
<script src="js/11-store.js"></script>
<script src="js/12-ui-core.js"></script>
<script src="js/13-view-overview.js"></script>
<script src="js/14-view-catalog.js"></script>
<script src="js/15-view-scenes.js"></script>
<script src="js/16-view-relations.js"></script>
<script src="js/17-view-roadmap.js"></script>
<script src="js/18-view-project.js"></script>
<script src="js/19-view-reference.js"></script>
<script src="js/20-init.js"></script>
</body>
</html>
